  let rawAmount = "0";

  function updateAmountDisplay() {
    const display = document.getElementById("amount-display");
    if (!rawAmount || rawAmount === "0") {
      display.innerText = "0.00";
      return;
    }
    const parsed = parseFloat(rawAmount);
    if (isNaN(parsed)) {
      display.innerText = "0.00";
    } else {
      if (rawAmount.includes(".")) {
        const parts = rawAmount.split(".");
        display.innerText = Number(parts[0]).toLocaleString("en-IN") + "." + (parts[1] || "");
      } else {
        display.innerText = parsed.toLocaleString("en-IN");
      }
    }
  }

  function pressKey(key) {
    if (key === ".") {
      if (!rawAmount.includes(".")) {
        rawAmount += ".";
      }
    } else {
      if (rawAmount === "0") {
        rawAmount = key;
      } else {
        if (rawAmount.includes(".")) {
          const decimals = rawAmount.split(".")[1];
          if (decimals && decimals.length >= 2) return;
        }
        if (rawAmount.length < 9) {
          rawAmount += key;
        }
      }
    }
    updateAmountDisplay();
  }

  function backspaceKey() {
    if (rawAmount.length > 1) {
      rawAmount = rawAmount.slice(0, -1);
    } else {
      rawAmount = "0";
    }
    updateAmountDisplay();
  }

  function clearAmount() {
    rawAmount = "0";
    updateAmountDisplay();
  }

  function addAmount(value) {
    const current = parseFloat(rawAmount) || 0;
    rawAmount = (current + value).toString();
    updateAmountDisplay();
  }

  function selectPayer(btn) {
    document.querySelectorAll(".payer-card").forEach(el => {
      el.className = "payer-card flex items-center gap-3 p-3 rounded-xl bg-surface-01 text-left transition-all hover:bg-surface-02";
      const icon = el.querySelector(".material-symbols-outlined");
      if (icon) {
        icon.className = "material-symbols-outlined text-text-muted ml-auto text-[20px] opacity-20";
        icon.innerText = "circle";
      }
      const avatarWrap = el.querySelector(".relative");
      if (avatarWrap) {
        avatarWrap.className = "relative w-11 h-11 rounded-full overflow-hidden bg-surface-02 shrink-0 p-0.5";
      }
    });

    btn.className = "payer-card flex items-center gap-3 p-3 rounded-xl bg-surface-02 text-left transition-all bg-surface-03 shadow-[0_0_16px_rgba(195,244,0,0.12)]";
    const activeIcon = btn.querySelector(".material-symbols-outlined");
    if (activeIcon) {
      activeIcon.className = "material-symbols-outlined text-primary-fixed ml-auto text-[20px]";
      activeIcon.innerText = "check_circle";
    }
    const activeAvatarWrap = btn.querySelector(".relative");
    if (activeAvatarWrap) {
      activeAvatarWrap.className = "relative w-11 h-11 rounded-full overflow-hidden bg-surface-01 shrink-0 p-0.5 bg-primary-fixed";
    }
  }

  function toggleBeneficiary(btn) {
    document.querySelectorAll(".beneficiary-chip").forEach(el => {
      el.className = "beneficiary-chip px-3.5 py-2 rounded-full bg-surface-01 text-text-muted hover:text-text-primary font-label-md text-label-md font-medium shrink-0 flex items-center gap-1.5";
      const dot = el.querySelector(".rounded-full");
      if (dot) dot.className = "w-2 h-2 rounded-full bg-surface-variant";
    });

    btn.className = "beneficiary-chip px-3.5 py-2 rounded-full bg-surface-02 text-tertiary-fixed font-label-md text-label-md font-semibold flex items-center gap-1.5 shrink-0 shadow-[0_0_12px_rgba(99,247,255,0.18)]";
    const activeDot = btn.querySelector(".rounded-full");
    if (activeDot) activeDot.className = "w-2 h-2 rounded-full bg-tertiary-fixed";
  }

  function selectCategory(btn) {
    document.querySelectorAll(".category-pill").forEach(el => {
      el.className = "category-pill py-2.5 px-3 rounded-xl bg-surface-01 hover:bg-surface-02 font-label-sm text-label-sm text-text-primary font-semibold flex items-center justify-center gap-1.5 transition-all text-center";
    });
    btn.className = "category-pill py-2.5 px-3 rounded-xl bg-surface-02 font-label-sm text-label-sm text-primary-fixed font-semibold flex items-center justify-center gap-1.5 transition-all text-center shadow-[0_0_12px_rgba(195,244,0,0.1)]";
  }

  function toggleEventDetails(checkbox) {
    const details = document.getElementById("event-details");
    if (checkbox.checked) {
      details.style.display = "flex";
    } else {
      details.style.display = "none";
    }
  }

  // Segmented Type Toggles
  const expBtn = document.getElementById("toggle-expense");
  const incBtn = document.getElementById("toggle-income");

  expBtn.addEventListener("click", () => {
    expBtn.className = "flex-1 py-2 rounded-full font-label-md text-label-md transition-all duration-200 bg-primary-fixed text-on-primary font-semibold shadow-[0_0_16px_rgba(195,244,0,0.25)] flex items-center justify-center gap-1.5";
    incBtn.className = "flex-1 py-2 rounded-full font-label-md text-label-md transition-all duration-200 text-text-muted hover:text-text-primary flex items-center justify-center gap-1.5";
  });

  incBtn.addEventListener("click", () => {
    incBtn.className = "flex-1 py-2 rounded-full font-label-md text-label-md transition-all duration-200 bg-tertiary-container text-on-tertiary font-semibold shadow-[0_0_16px_rgba(99,247,255,0.25)] flex items-center justify-center gap-1.5";
    expBtn.className = "flex-1 py-2 rounded-full font-label-md text-label-md transition-all duration-200 text-text-muted hover:text-text-primary flex items-center justify-center gap-1.5";
  });

  function recordTransaction() {
    const btn = document.getElementById("record-btn");
    const originalText = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Syncing Family Ledger...</span>`;
    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">check</span><span>Recorded!</span>`;
      setTimeout(() => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          btn.innerHTML = originalText;
          rawAmount = "0";
          updateAmountDisplay();
        }
      }, 600);
    }, 500);
  }
</script></main></body></html>
